spring.application.name=hostel-management
spring.profiles.default=local

# Server Configuration (Render dynamically injects PORT; defaults to 8080 for local dev)
server.port=${PORT:8080}

# MySQL Database Configuration
# Accepts SPRING_DATASOURCE_* or DB_* environment variables, defaulting to local MySQL
spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL:jdbc:mysql://localhost:3306/hostelManagement?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:root}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:root}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hikari Connection Pool Settings for Cloud / Hosted MySQL
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-test-query=SELECT 1

# Hibernate / JPA Configuration
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# CORS Allowed Origins (Comma-separated list; defaults to Vite dev server)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# JWT configuration
jwt.secret=${JWT_SECRET:dGhpcy1pcy1hLWRlZmF1bHQta2V5LWZvci1kZXYtYW5kLXRlc3RpbmctcHVycG9zZXMtb25seS0zMmJ5dGVz}
jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}

# Initial Admin Bootstrap (Optional)
app.system-admin.email=${SYSTEM_ADMIN_EMAIL:Premchand@gmail.com}
app.bootstrap-admin.enabled=${BOOTSTRAP_ADMIN_ENABLED:false}
app.bootstrap-admin.name=${BOOTSTRAP_ADMIN_NAME:System Administrator}
app.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:${app.system-admin.email:Premchand@gmail.com}}
app.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
